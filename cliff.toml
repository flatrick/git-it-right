# git-cliff config generated by `gir init` from gir.types in .girconfig.
# Changelog: git-cliff -o CHANGELOG.md    Next version: git-cliff --bumped-version
[changelog]
header = "# Changelog\n"
body = """
{% if version %}## {{ version }} - {{ timestamp | date(format="%Y-%m-%d") }}{% else %}## Unreleased{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | upper_first }}
{%- endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
sort_commits = "oldest"
commit_parsers = [
  { message = "^(fixup|squash|amend)!", skip = true },
  # This repository's own edit: addf commits are process records, not product changes.
  { message = "^[a-z]+\\(addf\\)", skip = true },
  # A merge commit titled after its pull request, "subject (#N)", repeats the commits it merges.
  { message = "^[^\\n]* \\(#[0-9]+\\)(\\n|$)", skip = true },
  { message = "^feat(\\(|!|:)", group = "Features" },
  { message = "^fix(\\(|!|:)", group = "Bug Fixes" },
  { message = "^docs(\\(|!|:)", group = "Documentation" },
  { message = "^style(\\(|!|:)", group = "Styling" },
  { message = "^refactor(\\(|!|:)", group = "Refactor" },
  { message = "^perf(\\(|!|:)", group = "Performance" },
  { message = "^test(\\(|!|:)", group = "Testing" },
  { message = "^build(\\(|!|:)", group = "Build" },
  { message = "^ci(\\(|!|:)", group = "CI" },
  { message = "^chore(\\(|!|:)", group = "Miscellaneous" },
  { message = "^revert(\\(|!|:)", group = "Reverts" },
]
