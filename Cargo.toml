[package]
name = "gir"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Keeps git usage honest: Conventional Commits lint + autofix, fixup workflow, repo hygiene doctor"
license = "MIT OR Apache-2.0"
repository = "https://github.com/flatrick/git-it-right"
readme = "README.md"
keywords = ["git", "conventional-commits", "commit-msg", "lint", "fixup"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src/**", "/CHEATSHEET.md", "/README.md", "/CHANGELOG.md", "/LICENSE-*"]

[dependencies]
git-conventional = "1.1"
lexopt = "0.3.2"
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
